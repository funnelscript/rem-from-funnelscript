name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
      - name: Verify tagged source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Package and verify release assets
        run: bash scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "REM From FunnelScript $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md dist/*.zip dist/*.tar.gz dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false

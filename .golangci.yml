# golangci-lint configuration
# Reference: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true
  go: "1.26"

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  disable-all: true
  enable:
    # Core correctness & defect detection
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Safety, resource leaks & concurrency
    - bodyclose
    - copyloopvar
    - errorlint
    - nilerr
    - noctx
    - wastedassign
    # Formatting, style & hygiene
    - gofmt
    - goimports
    - misspell
    - unconvert

linters-settings:
  govet:
    enable-all: false
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (io.Closer).Close
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/funnelscript/rem-from-funnelscript
  misspell:
    locale: US
    ignore-words:
      - cancelled

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude certain linter warnings on test files
    - path: _test\.go
      linters:
        - errcheck
        - noctx
